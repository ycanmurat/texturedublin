server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml application/manifest+json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /texturedublin { return 308 /texturedublin/; }
    location = /texturedublin/404.html { internal; }
    location = /texturedublin/site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location /texturedublin/_astro/ {
        expires 1y;
        try_files $uri =404;
    }
    location /texturedublin/ {
        error_page 404 /texturedublin/404.html;
        try_files $uri $uri/ =404;
    }
    location / { return 404; }
}
